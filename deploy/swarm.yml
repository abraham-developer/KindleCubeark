# Stack de PRODUCCIÓN para Docker Swarm (single-node o manager con registry).
# La red overlay `admin` es la existente donde corre traefik (external).
# Uso: docker stack deploy -c deploy/swarm.yml kindle
# Requiere secrets creados antes: kindle_db_password y kindle_session_secret.
version: "3.8"

services:
  app:
    # construida/etiquetada en el manager con podman build -t kindlecubeark:latest .
    # (o push al registry si el stack corre en más de un nodo)
    image: kindlecubeark:latest
    environment:
      NODE_ENV: production
      DATA_DIR: /data
      MAX_UPLOAD_MB: "100"
      # credenciales de db por secret: config.ts arma DATABASE_URL con estos datos
      DB_HOST: db
      DB_USER: kindle
      DB_NAME: kindle
      DB_PASSWORD_FILE: /run/secrets/kindle_db_password
      SESSION_SECRET_FILE: /run/secrets/kindle_session_secret
      # motor del modo estudio bilingüe (servicio translate de este stack)
      LIBRETRANSLATE_URL: http://translate:5000
    secrets:
      - kindle_db_password
      - kindle_session_secret
    volumes:
      - kindle_book_data:/data
    networks:
      - internal
      - admin
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      resources:
        limits:
          memory: 1G
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    labels:
      - traefik.enable=true
      # el app está en dos redes: forzar a traefik a resolverlo por `admin`
      - traefik.docker.network=admin
      - traefik.http.routers.kindle.rule=Host(`kindle.cubeark.dev`)
      - traefik.http.routers.kindle.entrypoints=websecure
      - traefik.http.routers.kindle.tls.certresolver=letsencryptresolver
      - traefik.http.routers.kindle.service=kindle
      - traefik.http.services.kindle.loadbalancer.server.port=3000
      - traefik.http.services.kindle.loadbalancer.passHostHeader=1
    healthcheck:
      # wget no existe en node:20-slim: el chequeo va con fetch nativo de node
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kindle
      POSTGRES_DB: kindle
      POSTGRES_PASSWORD_FILE: /run/secrets/kindle_db_password
    secrets:
      - kindle_db_password
    volumes:
      - kindle_db_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kindle"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  # LibreTranslate autohospedado (open source, offline): motor del modo
  # estudio bilingüe. Sin puertos publicados y sin labels de traefik
  # (traefik no lo rutea): únicamente el app le pega por
  # http://translate:5000. Va también en `admin` porque el primer
  # arranque descarga los modelos de internet y la red `internal` no
  # tiene salida (sin esto falla con «Temporary failure in name
  # resolution»). Carga solo inglés, español, alemán y chino.
  # Nota: el primer arranque tarda minutos en descargar los modelos.
  translate:
    image: libretranslate/libretranslate
    command: --load-only en,es,de,zh
    networks:
      - internal
      - admin
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      resources:
        limits:
          memory: 2G
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:5000/languages')\" || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 3

secrets:
  kindle_db_password:
    external: true
  kindle_session_secret:
    external: true

volumes:
  kindle_book_data: {}
  kindle_db_data: {}

networks:
  # red overlay externa del dueño donde corre traefik (entrypoint websecure
  # + certresolver letsencryptresolver). NO publicar puertos host del app.
  admin:
    external: true
    name: admin
  internal:
    driver: overlay
    internal: true
    driver_opts:
      encrypted: ""